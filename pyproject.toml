[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jc-speedtest"
version = "0.1.0"
description = "Lightweight, programmatic internet speed test for Python. No browser, no ads."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jacivaldo Carvalho", email = "jacivaldocarvalho@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "speedtest",
    "network",
    "telecom",
    "sre",
    "devops",
    "bandwidth",
    "latency",
    "diagnostics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
speedtest = ["speedtest-cli>=2.1.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "pre-commit>=3.7",
]

[project.scripts]
jc-speedtest = "jc_speedtest.cli:main"

[project.urls]
Homepage = "https://github.com/jacivaldocarvalho/jc-speedtest"
Repository = "https://github.com/jacivaldocarvalho/jc-speedtest"
Issues = "https://github.com/jacivaldocarvalho/jc-speedtest/issues"
Changelog = "https://github.com/jacivaldocarvalho/jc-speedtest/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jc_speedtest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=jc_speedtest --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: tests that hit the real network (skipped by default)",
]

[tool.coverage.run]
source = ["src/jc_speedtest"]

[[tool.mypy.overrides]]
module = ["speedtest"]
ignore_missing_imports = true
